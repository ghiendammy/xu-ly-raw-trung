<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Ultimate Studio - Tẩy Tủy Tông Sư</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Segoe UI', 'sans-serif'] },
                    colors: { primary: '#0066cc', 'primary-hover': '#0052a3' }
                }
            }
        }
    </script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        body { background-color: #f8fafc; }
        .dark body { background-color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .sortable-ghost { opacity: 0.4; background-color: #e2e8f0; }
        .dark .sortable-ghost { background-color: #334155; }
        .file-item { transition: background-color 0.2s ease, border-color 0.2s ease; }
        .file-item.active { background-color: #eff6ff; border-left: 4px solid #0066cc; }
        .dark .file-item.active { background-color: rgba(0, 102, 204, 0.15); border-left: 4px solid #3b82f6; }
        #loading-overlay { backdrop-filter: blur(4px); }
        .spinner { border: 4px solid rgba(0, 102, 204, 0.1); width: 48px; height: 48px; border-radius: 50%; border-left-color: #0066cc; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800 dark:text-slate-200">

    <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 h-14 flex items-center justify-between px-4 shrink-0 z-10">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-wand-magic-sparkles text-primary text-xl"></i>
            <h1 class="font-bold text-base md:text-lg tracking-tight">EPUB Ultimate Studio (Đầy Đủ Tính Năng)</h1>
        </div>
        
        <div class="flex items-center gap-2 md:gap-3">
            <button id="theme-toggle" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Đổi giao diện Sáng/Tối">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block"></i>
            </button>

            <label class="cursor-pointer bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs md:text-sm font-medium py-1.5 px-3 rounded shadow-sm transition-colors flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-primary"></i> Mở EPUB
                <input type="file" id="file-input" accept=".epub" class="hidden">
            </label>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Cột Trái: Sidebar danh sách chương -->
        <aside class="w-[300px] bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col shrink-0">
            <div class="p-3 border-b border-slate-100 dark:border-slate-700/50">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Tổng chương: <span id="chapter-count" class="text-primary font-bold">0</span></span>
                    <button onclick="handleAddChapter()" class="text-xs bg-primary hover:bg-primary-hover text-white py-1 px-2 rounded shadow-sm"><i class="fa-solid fa-plus"></i> Thêm</button>
                </div>
                <input type="text" id="search-input" placeholder="Lọc tên chương..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-primary">
            </div>
            
            <div class="flex-1 overflow-y-auto p-2">
                <ul id="spine-list" class="space-y-1">
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center space-y-3 mt-10">
                        <i class="fa-solid fa-box-open text-4xl opacity-50"></i>
                        <p class="text-sm">Chưa tải file truyện (.epub).</p>
                    </div>
                </ul>
            </div>
        </aside>

        <!-- Cột Phải: Main Content & Editor -->
        <section class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-900 relative">
            
            <!-- Toolbar chức năng -->
            <div id="toolbar" class="h-12 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-3 flex items-center justify-between hidden">
                <div class="flex items-center gap-1.5 overflow-x-auto">
                    <button onclick="handleSaveCurrent(true)" class="px-2.5 py-1 rounded bg-green-50 text-green-600 hover:bg-green-100 text-xs font-medium"><i class="fa-solid fa-save mr-1"></i> Lưu</button>
                    <button onclick="handleCleanAllChapters()" class="px-2.5 py-1 rounded bg-purple-50 text-purple-600 hover:bg-purple-100 text-xs font-medium"><i class="fa-solid fa-broom mr-1"></i> Xóa Rác Toàn Truyện</button>
                    <button onclick="openFindReplace()" class="px-2.5 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-medium"><i class="fa-solid fa-magnifying-glass mr-1"></i> Tìm & Thay Thế</button>
                </div>
                <span id="current-file-name" class="text-xs font-medium text-slate-400 truncate max-w-[150px] hidden md:block"></span>
            </div>

            <!-- Khung soạn thảo văn bản (Raw Text Mode bảo toàn 100% chữ không lo mất) -->
            <div class="flex-1 overflow-hidden p-4 flex flex-col">
                <div id="editor-container" class="flex-1 flex flex-col bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 p-4 hidden">
                    <textarea id="editor-textarea" class="w-full flex-1 bg-transparent text-slate-800 dark:text-slate-100 font-mono text-sm leading-relaxed outline-none resize-none" placeholder="Nội dung chương..."></textarea>
                </div>
                
                <div id="welcome-message" class="flex flex-col items-center justify-center text-slate-400 h-full text-center space-y-3">
                    <i class="fa-solid fa-feather text-6xl opacity-20"></i>
                    <h2 class="text-lg font-medium">Chọn một chương ở cột trái để bắt đầu chỉnh sửa</h2>
                    <p class="text-sm">Bảo đảm không bao giờ bị mất tiêu đề hay khúc đầu chương!</p>
                </div>
            </div>

            <!-- Thanh xuất file ở dưới cùng: Đầy đủ nút xuất EPUB và xuất TXT -->
            <div id="export-bar" class="h-14 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-4 flex items-center justify-end gap-3 hidden">
                <button onclick="handleExportTxt()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded shadow text-xs md:text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-down"></i> Tải Về File TXT Sạch
                </button>
                <button onclick="handleExportEpub()" class="bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded shadow text-xs md:text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Xuất File EPUB Mới
                </button>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/50 z-[100] flex flex-col items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-2xl flex flex-col items-center gap-4 border border-slate-200 dark:border-slate-700 min-w-[220px]">
            <div class="spinner"></div>
            <p id="loading-text" class="text-slate-700 dark:text-slate-200 font-medium">Đang xử lý...</p>
        </div>
    </div>

    <!-- Modal Tìm & Thay thế -->
    <div id="find-replace-modal" class="fixed inset-0 bg-slate-900/60 z-[105] flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-800 rounded-lg shadow-xl max-w-lg w-full p-5 mx-4 border border-slate-200 dark:border-slate-700">
            <h3 class="text-lg font-bold text-primary mb-3"><i class="fa-solid fa-magnifying-glass"></i> Tìm & Thay Thế Nhanh Toàn Truyện</h3>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Chuỗi cần tìm</label>
                    <input type="text" id="find-val" value="如有惡意廣告" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Thay thế thành</label>
                    <input type="text" id="replace-val" value="" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-primary">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="document.getElementById('find-replace-modal').classList.add('hidden')" class="bg-slate-200 dark:bg-slate-700 px-4 py-1.5 rounded text-sm">Đóng</button>
                <button onclick="executeFindReplaceAll()" class="bg-primary text-white px-4 py-1.5 rounded text-sm">Thay Thế Toàn Bộ</button>
            </div>
        </div>
    </div>

    <script>
        const htmlEl = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
        }
        document.getElementById('theme-toggle').onclick = () => {
            htmlEl.classList.toggle('dark');
            localStorage.theme = htmlEl.classList.contains('dark') ? 'dark' : 'light';
        };

        let epubZip = null;
        let opfPath = "";
        let opfDoc = null;
        let spine = [];
        let manifest = {};
        let fileContents = {};
        let fileTitles = {};
        let currentActiveId = null;
        let spineSortable = null;

        const ui = {
            list: document.getElementById('spine-list'),
            searchInput: document.getElementById('search-input'),
            textarea: document.getElementById('editor-textarea'),
            editorContainer: document.getElementById('editor-container'),
            welcome: document.getElementById('welcome-message'),
            toolbar: document.getElementById('toolbar'),
            exportBar: document.getElementById('export-bar'),
            currentName: document.getElementById('current-file-name'),
            count: document.getElementById('chapter-count')
        };

        function showLoading(text) { document.getElementById('loading-text').textContent = text; document.getElementById('loading-overlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            loadEpubFile(file);
        });

        async function loadEpubFile(file) {
            showLoading("Đang mở file EPUB...");
            epubZip = new JSZip();
            spine = []; manifest = {}; fileContents = {}; fileTitles = {}; currentActiveId = null;

            try {
                await epubZip.loadAsync(file.arrayBuffer());
                const containerXml = await epubZip.file("META-INF/container.xml").async("string");
                const parser = new DOMParser();
                const containerDoc = parser.parseFromString(containerXml, 'text/xml');
                opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');
                const opfBasePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';

                const opfStr = await epubZip.file(opfPath).async("string");
                opfDoc = parser.parseFromString(opfStr, 'text/xml');
                
                opfDoc.querySelectorAll('manifest > item').forEach(item => {
                    manifest[item.getAttribute('id')] = item.getAttribute('href');
                });

                opfDoc.querySelectorAll('spine > itemref').forEach(ref => {
                    spine.push(ref.getAttribute('idref'));
                });

                await Promise.all(spine.map(async (id) => {
                    const href = manifest[id];
                    const fullPath = opfBasePath + href;
                    let fileObj = epubZip.file(fullPath) || epubZip.file(decodeURIComponent(fullPath));
                    if(fileObj) {
                        const content = await fileObj.async("string");
                        fileContents[id] = content;
                        fileTitles[id] = extractTitle(content, href);
                    }
                }));

                renderSpineList();
                initSortable();
                ui.exportBar.classList.remove('hidden');
                hideLoading();
            } catch (err) {
                hideLoading();
                alert("Lỗi mở file: " + err.message);
            }
        }

        function extractTitle(html, fallback) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const h = doc.querySelector('h1, h2, h3');
            if (h && h.textContent.trim()) return h.textContent.replace(/\s+/g, ' ').trim();
            const t = doc.querySelector('title');
            if (t && t.textContent.trim()) return t.textContent.replace(/\s+/g, ' ').trim();
            return fallback;
        }

        function renderSpineList(filter = "") {
            ui.list.innerHTML = '';
            ui.count.textContent = spine.length;
            filter = filter.toLowerCase();

            spine.forEach(id => {
                const title = fileTitles[id] || manifest[id];
                if (filter && !title.toLowerCase().includes(filter)) return;

                const li = document.createElement('li');
                li.className = `file-item flex items-center justify-between p-2.5 rounded cursor-pointer border border-transparent group ${currentActiveId === id ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`;
                li.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1" onclick="openChapter('${id}')">
                        <i class="fa-solid fa-grip-vertical text-slate-300 cursor-grab handle shrink-0"></i>
                        <span class="text-sm font-medium truncate">${title}</span>
                    </div>
                    <button onclick="handleDeleteChapter('${id}')" class="shrink-0 w-7 h-7 rounded text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 flex items-center justify-center"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                ui.list.appendChild(li);
            });
        }

        ui.searchInput.oninput = (e) => renderSpineList(e.target.value);

        function initSortable() {
            if (spineSortable) spineSortable.destroy();
            spineSortable = new Sortable(ui.list, { handle: '.handle', animation: 150, onEnd: (evt) => {
                const item = spine.splice(evt.oldIndex, 1)[0];
                spine.splice(evt.newIndex, 0, item);
            }});
        }

        function openChapter(id) {
            handleSaveCurrent(false);
            currentActiveId = id;
            ui.textarea.value = fileContents[id] || "";
            ui.currentName.textContent = manifest[id];
            renderSpineList(ui.searchInput.value);
            ui.welcome.classList.add('hidden');
            ui.editorContainer.classList.remove('hidden');
            ui.toolbar.classList.remove('hidden');
        }

        function handleSaveCurrent(showToast = false) {
            if (!currentActiveId) return;
            fileContents[currentActiveId] = ui.textarea.value;
            fileTitles[currentActiveId] = extractTitle(fileContents[currentActiveId], manifest[currentActiveId]);
            renderSpineList(ui.searchInput.value);
            if (showToast) alert("Đã lưu chương thành công!");
        }

        function handleCleanAllChapters() {
            if (!confirm("Dọn sạch rác quảng cáo '如有惡意廣告' toàn bộ truyện?")) return;
            handleSaveCurrent(false);
            let count = 0;
            spine.forEach(id => {
                let text = fileContents[id];
                if (text.includes("如有惡意廣告")) {
                    text = text.replace(/<p>[^<]*如有惡意廣告[^<]*<\/p>/gi, '');
                    text = text.replace(/如有惡意廣告[^\n]*/gi, '');
                    fileContents[id] = text;
                    count++;
                }
            });
            if (currentActiveId) openChapter(currentActiveId);
            alert(`Đã dọn sạch rác trên ${count} chương!`);
        }

        function openFindReplace() { document.getElementById('find-replace-modal').classList.remove('hidden'); }
        function executeFindReplaceAll() {
            const find = document.getElementById('find-val').value;
            const replace = document.getElementById('replace-val').value;
            if (!find) return alert("Vui lòng nhập từ khóa cần tìm!");
            document.getElementById('find-replace-modal').classList.add('hidden');
            handleSaveCurrent(false);

            let count = 0;
            spine.forEach(id => {
                let content = fileContents[id];
                if (content.includes(find)) {
                    fileContents[id] = content.split(find).join(replace);
                    count++;
                }
            });
            if (currentActiveId) openChapter(currentActiveId);
            alert(`Đã thay thế thành công trên các chương có chứa từ khóa!`);
        }

        function handleAddChapter() {
            const id = 'chap_new_' + Date.now();
            const href = `chapter_${Date.now()}.xhtml`;
            manifest[id] = href;
            spine.push(id);
            fileContents[id] = `<body><h1>Chương mới</h1><p>Nội dung...</p></body>`;
            fileTitles[id] = "Chương mới";
            renderSpineList();
            openChapter(id);
        }

        function handleDeleteChapter(id) {
            if (!confirm("Xóa chương này?")) return;
            spine = spine.filter(s => s !== id);
            if (currentActiveId === id) {
                currentActiveId = null;
                ui.editorContainer.classList.add('hidden');
                ui.toolbar.classList.add('hidden');
                ui.welcome.classList.remove('hidden');
            }
            renderSpineList();
        }

        async function handleExportEpub() {
            handleSaveCurrent(false);
            showLoading("Đang đóng gói file EPUB...");
            try {
                const opfBasePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
                const manifestNode = opfDoc.querySelector('manifest');
                const spineNode = opfDoc.querySelector('spine');
                
                while(manifestNode.firstChild) manifestNode.removeChild(manifestNode.firstChild);
                while(spineNode.firstChild) spineNode.removeChild(spineNode.firstChild);
                
                spine.forEach(id => {
                    const item = opfDoc.createElement('item');
                    item.setAttribute('id', id);
                    item.setAttribute('href', manifest[id]);
                    item.setAttribute('media-type', 'application/xhtml+xml');
                    manifestNode.appendChild(item);
                    
                    const itemref = opfDoc.createElement('itemref');
                    itemref.setAttribute('idref', id);
                    spineNode.appendChild(itemref);
                });
                
                const serializer = new XMLSerializer();
                epubZip.file(opfPath, serializer.serializeToString(opfDoc));
                
                spine.forEach(id => {
                    epubZip.file(opfBasePath + manifest[id], fileContents[id]);
                });
                
                const blob = await epubZip.generateAsync({ type: "blob", compression: "DEFLATE" });
                saveAs(blob, "truyen_da_lam_sach.epub");
                hideLoading();
            } catch(e) {
                hideLoading();
                alert("Lỗi xuất file: " + e.message);
            }
        }

        function handleExportTxt() {
            handleSaveCurrent(false);
            let fullTxt = "";
            spine.forEach(id => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(fileContents[id], 'html');
                const text = doc.body ? doc.body.textContent : fileContents[id];
                fullTxt += `\n\n----------------------------------------\n`;
                fullTxt += text.trim();
                fullTxt += `\n----------------------------------------\n\n`;
            });
            const blob = new Blob([fullTxt.trim()], { type: "text/plain;charset=utf-8" });
            saveAs(blob, "truyen_sach.txt");
        }
    </script>
</body>
</html>
